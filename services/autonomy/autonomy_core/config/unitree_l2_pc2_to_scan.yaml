# Parameters for pointcloud_to_laserscan: Unitree L2 PointCloud2 -> /scan (LaserScan).
# Tune min_height/max_height and angle_* for your mount and forward arc.
/**:
  ros__parameters:
    target_frame: ""
    transform_tolerance: 0.01
    min_height: -0.15
    max_height: 0.45
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.008726646259971648
    scan_time: 0.05
    range_min: 0.45
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
