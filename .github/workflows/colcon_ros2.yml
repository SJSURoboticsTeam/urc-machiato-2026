# Colcon build + pytest subset marked `ros2` (plan: dedicated CI job).
name: Colcon ROS 2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/**"
      - "shared/interfaces/**"
      - "shared/core/**"
      - ".github/workflows/colcon_ros2.yml"

jobs:
  colcon-and-ros2-pytest:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ROS 2 Humble and message packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            software-properties-common \
            curl
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu jammy main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ros-base \
            python3-pip \
            python3-colcon-common-extensions
          sudo apt-get install -y \
            ros-humble-sensor-msgs \
            ros-humble-geometry-msgs \
            ros-humble-nav-msgs

      - name: Install Python test dependencies
        run: |
          pip install -e ".[dev]"

      - name: Colcon build (autonomy + gazebo_simulation)
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          mkdir -p "${HOME}/ros2_ws/src"
          ws="${HOME}/ros2_ws"
          cp -r "${GITHUB_WORKSPACE}/shared/interfaces/autonomy_interfaces" "${ws}/src/"
          cp -r "${GITHUB_WORKSPACE}/services/autonomy/autonomy_core" "${ws}/src/"
          cp -r "${GITHUB_WORKSPACE}/services/autonomy/bt" "${ws}/src/"
          cp -r "${GITHUB_WORKSPACE}/services/simulation/gazebo" "${ws}/src/"
          cd "${ws}"
          rosdep install --from-paths src --ignore-src -y || true
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install \
            --packages-select autonomy_interfaces autonomy_core autonomy_bt gazebo_simulation

      - name: Pytest (marker ros2)
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}:${{ github.workspace }}/shared:${{ github.workspace }}/services:${{ github.workspace }}/services/autonomy/autonomy_core
        run: |
          set -e
          source /opt/ros/humble/setup.bash
          source "${HOME}/ros2_ws/install/setup.bash"
          cd "${GITHUB_WORKSPACE}"
          pytest tests/ -m ros2 -v --tb=short \
            --override-ini="addopts=-ra" \
            --override-ini="python_files=test_*.py"
